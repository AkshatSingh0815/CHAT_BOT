<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM-JAY AYUSHMAAN BHARAT Claims Assistant</title>
       <title>Akshat Singh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
        }
        .container {
            width: 100vw;
            height: 100vh;
            background: #0a0a0a;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background :rgb(0, 41, 46);
            color: white;
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid #ff6f00;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #e3a8b4 0%, #817469 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 14px;
            color: #cc9999;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #b0aeae;
        }

        .message {
            margin-bottom: 15px;
            display: flex;  
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #ff1744 0%, #ff6f00 100%);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: #2e445f;
            color: #e0e0e0;
            border: 1px solid #010a11;
            border-bottom-left-radius: 4px;
        }

        .input-section {
            padding: 20px;
            background: rgb(0, 41, 46);
            border-top: 1px solid #ff6f00;
            display: flex;
            gap: 10px;
        }

        .input-group {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ff6f00;
            border-radius: 8px;
            font-size: 14px;
            background: #1a1a1a;
            color: #e0e0e0;
            transition: border-color 0.3s;
        }

        #userInput::placeholder {
            color: #998877;
        }

        #userInput:focus {
            outline: none;
            border-color: #ff1744;
            background: #1a1a1a;
        }

        button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #ff1744 0%, #ff6f00 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 23, 68, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff6f00;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.5;
            }
            30% {
                opacity: 1;
            }
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #ff6f00;
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #ff1744;
        }

        .corner-image {
            position: fixed;
            width: 150px;
            height: 150px;
            opacity: 0.15;
            pointer-events: none;
            object-fit: contain;
        }

        .corner-tl {
            top: 20px;
            left: 20px;
        }

        .corner-tr {
            top: 20px;
            right: 20px;
            transform: scaleX(-1);
        }

        .corner-bl {
            bottom: 20px;
            left: 20px;
            transform: scaleY(-1);
        }

        .corner-br {
            bottom: 20px;
            right: 20px;
            transform: scaleX(-1) scaleY(-1);
        }

        /* Video Transition Boxes */
        .video-box {
            position: fixed;
            width: 180px;
            height: 140px;
            border: 2px solid #ff6f00;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(5px);
            overflow: hidden;
            z-index: 100;
            animation: slideInBox 0.6s ease-out;
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.3);
        }
        @keyframes slideInBox {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(255, 23, 68, 0.3);
            }
            50% {
                box-shadow: 0 0 30px rgba(255, 111, 0, 0.5);
            }
        }
        .video-box {
            animation: slideInBox 0.6s ease-out, pulse 2s ease-in-out infinite;
        }
        .video-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        .video-box-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            z-index: 2;
        }

        .video-icon {
            font-size: 40px;
            filter: drop-shadow(0 0 5px rgba(255, 111, 0, 0.5));
        }

        .video-text {
            font-size: 11px;
            color: #ff6f00;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .video-box-tl {
            top: 120px;
            left: 20px;
        }

        .video-box-tr {
            top: 120px;
            right: 20px;
        }

        .video-box-bl {
            bottom: 120px;
            left: 20px;
        }

        .video-box-br {
            bottom: 120px;
            right: 20px;
        }

        @media (max-width: 600px) {
            .container {
                height: 100vh;
            }

            .message-content {
                max-width: 90%;
            }

            .header h1 {
                font-size: 22px;
            }

            .corner-image {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <!-- Corner Images for PM-JAY Theme -->
    <img src="https://img.icons8.com/color/150/000000/heart-health.png" alt="Health Icon" class="corner-image corner-tl">
    <img src="https://img.icons8.com/color/150/000000/hospital.png" alt="Hospital Icon" class="corner-image corner-tr">
    <img src="https://img.icons8.com/color/150/000000/medical-license.png" alt="Medical Icon" class="corner-image corner-bl">
    <img src="https://img.icons8.com/color/150/000000/health-insurance.png" alt="Insurance Icon" class="corner-image corner-br">

   
    <div class="container">
        <div class="header">
            <h1>📋 PM-JAY Claims Assistant</h1>
            <p>Get instant answers about your claims and insurance policies</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-content">
                    Hello! I'm your PM-JAY Claims Assistant. Ask me anything about claim status, required documents, approval processes, or reimbursement. How can I help you today?
                </div>
            </div>
        </div>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Ask your question here..." 
                    onkeypress="handleKeyPress(event)"
                >
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    <script>
        function sendMessage() {
            let message = document.getElementById("userInput").value.trim();    
            if (!message) return;
            displayMessage(message, 'user');
            document.getElementById("userInput").value = '';
            showTypingIndicator();
            fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: message})
            })
            .then(response => response.json())
            .then(data => {
                removeTypingIndicator();
                displayMessage(data.response, 'bot');
            })
            .catch(error => {
                removeTypingIndicator();
                displayMessage("Sorry, there was an error. Please try again.", 'bot');
                console.error('Error:', error);
            });
        }

        function displayMessage(message, sender) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = message;
            
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        function showTypingIndicator() {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'typingIndicator';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content typing-indicator';
            contentDiv.innerHTML = '<span></span><span></span><span></span>';
            
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        window.addEventListener('load', () => {
            document.getElementById('userInput').focus();
        });
    </script>
</body>
</html>
